<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Submit a website to the community directory">
  <title>Submit a Website</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --accent:#3157d5; --line:#d9deea; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#f3f5fb; color:var(--ink); font-family:Arial, sans-serif; }
    main { width:min(100%, 520px); padding:30px; border:1px solid var(--line); border-radius:18px; background:#fff; box-shadow:0 12px 35px #17203312; }
    h1 { margin:0 0 8px; font-size:1.7rem; }
    p { margin:0 0 24px; color:#5e6678; line-height:1.6; }
    label { display:block; margin:18px 0 7px; font-weight:700; }
    input { width:100%; padding:13px 14px; border:1px solid #bfc7d8; border-radius:9px; font:inherit; }
    input:focus { outline:3px solid #3157d533; border-color:var(--accent); }
    button { width:100%; margin-top:22px; padding:13px; border:0; border-radius:9px; background:var(--accent); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.65; cursor:wait; }
    #status { min-height:1.5em; margin-top:16px; font-weight:700; }
    .hint { font-size:.9rem; margin-top:14px; margin-bottom:0; }
  </style>
</head>
<body>
  <main>
    <h1>Submit a Website</h1>
    <p>Fill in both fields to suggest a website for the community directory.</p>
    <form id="site-form">
      <label for="site-name">Website name</label>
      <input id="site-name" name="site_name" maxlength="120" required placeholder="e.g. My Website">
      <label for="site-url">Website URL</label>
      <input id="site-url" name="site_url" type="url" maxlength="2048" required placeholder="https://example.com" dir="ltr">
      <button id="submit-button" type="submit">Submit</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
    <p class="hint">Submissions are saved to the project's SITES.CSV file on GitHub.</p>
  </main>
  <script>
    const form = document.querySelector("#site-form");
    const button = document.querySelector("#submit-button");
    const status = document.querySelector("#status");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "";
      button.disabled = true;
      button.textContent = "Submitting...";
      try {
        const response = await fetch("/api/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            site_name: form.elements.site_name.value.trim(),
            site_url: form.elements.site_url.value.trim()
          })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Submission failed.");
        status.textContent = "Website saved successfully!";
        form.reset();
      } catch (error) {
        status.textContent = error.message || "Could not save right now. Please try again later.";
      } finally {
        button.disabled = false;
        button.textContent = "Submit";
      }
    });
  </script>
</body>
</html>
